name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: npm run secrets:audit

      - name: Audit attached assets
        run: npm run assets:audit

      - name: Audit migration manifest
        run: npm run db:audit:schema

      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Require a clean production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run safety tests
        run: npm test

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Cutover preflight sanity
        run: PREFLIGHT_HEALTH_URL=skip PREFLIGHT_SKIP_LOCAL_CHECKS=true npm run cutover:preflight
